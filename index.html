<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No More Uploads!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .drop-zone {
            width: 100%;
            max-width: 800px;
            border: 3px dashed #444;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #feca57;
            background: rgba(254, 202, 87, 0.05);
        }

        .drop-zone p {
            font-size: 1.2rem;
            color: #888;
        }

        .drop-zone .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #file-input {
            display: none;
        }

        .file-info {
            display: none;
            width: 100%;
            max-width: 800px;
            background: #16213e;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .file-info.visible {
            display: flex;
        }

        .file-name {
            font-weight: 600;
            color: #feca57;
        }

        .file-size {
            color: #888;
            font-size: 0.9rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-copy {
            background: #feca57;
            color: #1a1a2e;
        }

        .btn-copy:hover {
            background: #feb700;
            transform: scale(1.05);
        }

        .btn-copy.copied {
            background: #2ecc71;
            color: white;
        }

        .content-area {
            display: none;
            width: 100%;
            max-width: 800px;
            flex: 1;
        }

        .content-area.visible {
            display: block;
        }

        .content-box {
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ddd;
        }

        .content-box img {
            max-width: 100%;
            border-radius: 8px;
        }

        .supported {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <h1>No More Uploads!</h1>
    <p class="subtitle">Open a file and show it to ChatGPT — no uploading needed.</p>

    <div class="drop-zone" id="drop-zone">
        <div class="icon">📂</div>
        <p>Click or drag a file here</p>
        <p class="supported">Supports: .txt, .pdf (text), .py, .js, .html, .css, .json, .md, images, and more</p>
        <input type="file" id="file-input">
    </div>

    <div class="file-info" id="file-info">
        <div>
            <span class="file-name" id="file-name"></span>
            <span class="file-size" id="file-size"></span>
        </div>
        <div class="actions">
            <button class="btn btn-copy" id="copy-btn" onclick="copyContent()">Copy All</button>
            <button class="btn btn-clear" onclick="clearFile()">Clear</button>
        </div>
    </div>

    <div class="content-area" id="content-area">
        <div class="content-box" id="content-box"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const contentArea = document.getElementById('content-area');
        const contentBox = document.getElementById('content-box');
        const copyBtn = document.getElementById('copy-btn');

        let currentContent = '';

        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            fileName.textContent = file.name;
            fileSize.textContent = ` (${formatSize(file.size)})`;
            fileInfo.classList.add('visible');
            contentArea.classList.add('visible');

            const ext = file.name.split('.').pop().toLowerCase();
            const imageTypes = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'];

            if (imageTypes.includes(ext) || file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    contentBox.innerHTML = `<img src="${e.target.result}" alt="${file.name}">`;
                    currentContent = `[Image: ${file.name}]`;
                };
                reader.readAsDataURL(file);
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentContent = e.target.result;
                    contentBox.textContent = currentContent;
                };
                reader.readAsText(file);
            }
        }

        function copyContent() {
            navigator.clipboard.writeText(currentContent).then(() => {
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy All';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        function clearFile() {
            fileInfo.classList.remove('visible');
            contentArea.classList.remove('visible');
            contentBox.textContent = '';
            currentContent = '';
            fileInput.value = '';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
    </script>
</body>
</html>
